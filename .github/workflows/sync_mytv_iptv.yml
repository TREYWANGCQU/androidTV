# .github/workflows/sync_mytv_iptv.yml
name: Sync mytv Pure IPv4 IPTV Subscription

on:
  schedule:
    # 每天北京时间 04:00 (UTC 20:00) 自动定时执行
    - cron: '0 20 * * *'
  workflow_dispatch:
    # 支持在 GitHub 网页端手动一键触发运行
  push:
    branches:
      - main
      - master
    paths:
      - 'config/iptv/**'
      - 'scripts/iptv/**'
      - '.github/workflows/sync_mytv_iptv.yml'

jobs:
  build-and-sync:
    name: Compile & Push to Gist
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.11 运行时
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装流水线依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: 门禁防御前置单测 (Unit Tests Gate)
        run: |
          echo "==== 正在执行编译引擎语法与 IPv4 门禁单元测试 ===="
          python -m unittest scripts/iptv/test_compiler.py

      - name: 执行云端纯 IPv4 探活与多格式编译
        run: |
          echo "==== 正在抓取上游源池并执行纯 IPv4 异步探活 ===="
          python scripts/iptv/compiler.py --manifest config/iptv/channels_manifest.json --output-dir output

      - name: 上传构建产物至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-subscriptions
          path: output/
          retention-days: 14

      - name: 同步更新 GitHub Gist 永久订阅链接
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python -c "
          import os, sys, json, urllib.request

          gist_token = os.environ.get('GIST_TOKEN')
          gist_id = os.environ.get('GIST_ID')

          if not gist_token or not gist_id:
              print('::error::未检测到 GIST_TOKEN 或 GIST_ID，请在仓库 Settings -> Secrets and variables -> Actions 中配置！')
              sys.exit(1)

          # 校验产物完整性
          m3u_path = 'output/live_custom.m3u'
          txt_path = 'output/live_custom.txt'
          stat_path = 'output/channels_stat.json'

          if not os.path.exists(m3u_path) or not os.path.exists(txt_path):
              print('::error::产物文件缺失，拒绝更新 Gist！')
              sys.exit(1)

          with open(m3u_path, 'r', encoding='utf-8') as f:
              m3u_content = f.read()

          with open(txt_path, 'r', encoding='utf-8') as f:
              txt_content = f.read()

          stat_content = ''
          if os.path.exists(stat_path):
              with open(stat_path, 'r', encoding='utf-8') as f:
                  stat_content = f.read()

          # 质量门禁：检查 M3U 行数与 IPv4 纯净性
          if '[2409:' in m3u_content or '[2408:' in m3u_content or '[240e:' in m3u_content:
              print('::error::发现 IPv6 地址泄露，触发安全熔断，拒绝推送至 Gist！')
              sys.exit(1)

          m3u_lines = [l for l in m3u_content.splitlines() if l and not l.startswith('#')]
          if len(m3u_lines) == 0:
              print('::error::有效可用流媒体线路数为 0，触发保底拦截，拒绝覆盖 Gist 历史可用版本！')
              sys.exit(1)

          print(f'门禁复核通过：本次待更新有效线路数 = {len(m3u_lines)}')

          # 构造 Gist API PATCH 负载
          payload = {
              'description': 'mytv-android 纯 IPv4 优质电视频道订阅 (每日自动探活更新)',
              'files': {
                  'live_custom.m3u': {'content': m3u_content},
                  'live_custom.txt': {'content': txt_content},
              }
          }
          if stat_content:
              payload['files']['channels_stat.json'] = {'content': stat_content}

          url = f'https://api.github.com/gists/{gist_id}'
          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(
              url,
              data=data,
              headers={
                  'Authorization': f'token {gist_token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'mytv-iptv-sync-workflow'
              },
              method='PATCH'
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  if resp.status == 200:
                      resp_data = json.loads(resp.read().decode('utf-8'))
                      owner = resp_data.get('owner', {}).get('login', 'user')
                      print('============================================================')
                      print('🎉 GitHub Gist 同步更新成功！')
                      print(f'📌 订阅管理页面: https://gist.github.com/{gist_id}')
                      print(f'🔗 电视端 M3U 永久订阅直链: https://gist.githubusercontent.com/{owner}/{gist_id}/raw/live_custom.m3u')
                      print(f'🔗 电视端 TXT 永久订阅直链: https://gist.githubusercontent.com/{owner}/{gist_id}/raw/live_custom.txt')
                      print('============================================================')
                  else:
                      print(f'::error::Gist API 响应状态异常: HTTP {resp.status}')
                      sys.exit(1)
          except urllib.error.HTTPError as e:
              err_msg = e.read().decode('utf-8')
              print(f'::error::Gist API 请求失败 (HTTP {e.code}): {err_msg}')
              sys.exit(1)
          except Exception as e:
              print(f'::error::同步更新 Gist 时发生未知异常: {e}')
              sys.exit(1)
          "

